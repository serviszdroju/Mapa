plugins {
    id "com.android.application"
}

android {
    namespace "cz.astip.serviszdroju"
    compileSdk 36

    def escapeBuildConfigString = { value ->
        return String.valueOf(value ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
    }
    def googleWebClientId = providers
        .environmentVariable("SZZ_FIREBASE_GOOGLE_WEB_CLIENT_ID")
        .orElse(providers.gradleProperty("szzFirebaseGoogleWebClientId"))
        .getOrElse("304123957651-8nnf5s40h56r63uiqddooioiu7fqh8pk.apps.googleusercontent.com")

    defaultConfig {
        applicationId "cz.astip.serviszdroju"
        minSdk 23
        targetSdk 36
        versionCode 46
        versionName "1.1.44-protocol-handoff-mobile"

        manifestPlaceholders = [
            webHost: "serviszdroju.github.io",
            webPathPrefix: "/Mapa"
        ]

        buildConfigField "String", "LAUNCH_URL", "\"https://serviszdroju.github.io/Mapa/?app=android&source=apk&v=protocol-handoff-mobile-v648\""
        buildConfigField "String", "WEB_ORIGIN", "\"https://serviszdroju.github.io\""
        buildConfigField "String", "FIREBASE_GOOGLE_WEB_CLIENT_ID", "\"${escapeBuildConfigString(googleWebClientId)}\""
        buildConfigField "String", "FIREBASE_WEB_API_KEY", "\"AIzaSyDPXDtM0NH0H2p_gT5KsRPyxhCotBTcq88\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"astip---servis\""
        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"dnxjc6ixi\""
        buildConfigField "String", "CLOUDINARY_UPLOAD_PRESET", "\"astip_mapy\""
        buildConfigField "String", "CLOUDINARY_FOLDER", "\"astip-servis\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePathValue = project.findProperty("SZZ_RELEASE_STORE_FILE")
            def storePasswordValue = project.findProperty("SZZ_RELEASE_STORE_PASSWORD")
            def keyAliasValue = project.findProperty("SZZ_RELEASE_KEY_ALIAS")
            def keyPasswordValue = project.findProperty("SZZ_RELEASE_KEY_PASSWORD")
            if (storePathValue && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storePathValue)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "com.google.android.gms:play-services-auth:21.1.1"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
